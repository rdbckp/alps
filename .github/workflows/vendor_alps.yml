name: Build vendor.img - LITE (ALPS tree) 1

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: "Branch manifest LineageOS"
        required: true
        default: "lineage-18.1"
      device:
        description: "Nama device (folder di device/samsung/<device>)"
        required: true
        default: "a02"
      lunch_target:
        description: "Lunch combo (device_variant)"
        required: true
        default: "lineage_a02-userdebug"
      build_target:
        description: "Target make: vendorimage (paling kecil) / bootimage / systemimage / bacon"
        required: true
        default: "vendorimage"
      local_manifest_url:
        description: "Raw URL ke local_manifests xml kamu (device tree + kernel repo)"
        required: true
        default: "https://raw.githubusercontent.com/rdbckp/vendor/main/.repo/local_manifests/a02.xml"
      blob_filter_size:
        description: "Partial clone: skip blob lebih gede dari ini kecuali dibutuhin (contoh: 10M, 20M)"
        required: true
        default: "10M"
      alps_repo_url:
        description: "Repo dump ALPS (sumber vendor blob)"
        required: true
        default: "https://github.com/rdbckp/alps.git"
      alps_branch:
        description: "Branch repo ALPS"
        required: true
        default: "main"
      alps_dump_path:
        description: "Path folder dump di dalam repo ALPS"
        required: true
        default: "dump/samsung_a02"

jobs:
  build-vendor-image-lite:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Bebasin disk sebanyak mungkin
        run: |
          echo "== Disk sebelum cleanup =="
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" /usr/local/.ghcup \
            /usr/share/swift /opt/az /usr/lib/jvm || true
          sudo docker image prune --all --force || true
          sudo apt-get clean
          echo "== Disk sesudah cleanup =="
          df -h

      - name: Install dependency build Android
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig python3 python-is-python3

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Setup git identity (dibutuhin repo tool)
        run: |
          git config --global user.name "gh-actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false

      - name: repo init manifest LineageOS (partial clone)
        run: |
          mkdir -p ~/lineage20 && cd ~/lineage20
          repo init --depth=1 \
            --partial-clone --clone-filter=blob:limit=${{ github.event.inputs.blob_filter_size }} \
            -u https://github.com/LineageOS/android.git \
            -b ${{ github.event.inputs.manifest_branch }} --git-lfs

      - name: Pasang local manifest (device tree + kernel + vendor)
        run: |
          cd ~/lineage20
          mkdir -p .repo/local_manifests
          curl -L -o .repo/local_manifests/local.xml \
            "${{ github.event.inputs.local_manifest_url }}"
          cat .repo/local_manifests/local.xml

      - name: repo sync (partial clone — lebih hemat disk & waktu)
        run: |
          cd ~/lineage20
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags --optimized-fetch
          df -h

      - name: Fix symlink & hilangkan duplikasi module (Soong Conflict Fix)
        run: |
          cd ~/lineage20
          for link in device/samsung/${{ github.event.inputs.device }} vendor/samsung/${{ github.event.inputs.device }}; do
            if [ -L "$link" ]; then
              target=$(readlink -f "$link")
              echo "Convert symlink: $link -> $target"
              rm "$link"
              cp -rL "$target" "$link"
              rm -rf "$target"
            else
              echo "$link bukan symlink, skip"
            fi
          done
          # Hapus sisa folder source vendor alternatif jika ada
          find . -maxdepth 2 -type d -name "*_vendor" -exec rm -rf {} + 2>/dev/null || true

      - name: Clone ALPS dump (sparse - vendor blobs only)
        run: |
          rm -rf ~/alps_dump
          git clone --filter=blob:none --no-checkout --depth 1 \
            --branch "${{ github.event.inputs.alps_branch }}" \
            "${{ github.event.inputs.alps_repo_url }}" ~/alps_dump
          cd ~/alps_dump
          git sparse-checkout init --cone
          git sparse-checkout set \
            "${{ github.event.inputs.alps_dump_path }}/vendor" \
            "${{ github.event.inputs.alps_dump_path }}/all_files.txt" \
            "${{ github.event.inputs.alps_dump_path }}/board-info.txt"
          git checkout "${{ github.event.inputs.alps_branch }}"
          echo "== Isi hasil sparse-checkout =="
          du -sh "${{ github.event.inputs.alps_dump_path }}"
          ls -la "${{ github.event.inputs.alps_dump_path }}"

      - name: Extract vendor blobs dari ALPS dump
        run: |
          cd ~/lineage20
          EXTRACT_SCRIPT="device/samsung/${{ github.event.inputs.device }}/extract-files.sh"
          if [ -f "$EXTRACT_SCRIPT" ]; then
            bash "$EXTRACT_SCRIPT" ~/alps_dump/${{ github.event.inputs.alps_dump_path }}
          else
            echo "!! Gak ada extract-files.sh di device tree — blob memakai file yang sudah ter-commit."
          fi

      - name: Bersihin proprietary-files.txt & regenerate Android.bp
        run: |
          cd ~/lineage20
          PF="vendor/samsung/${{ github.event.inputs.device }}/proprietary-files.txt"
          SETUP="device/samsung/${{ github.event.inputs.device }}/setup-makefiles.sh"

          if [ -f "$PF" ]; then
            CONFLICT_LINES=(
              "vendor/bin/hw/android.hardware.audio.service"
              "vendor/bin/hw/android.hardware.cas@1.2-service"
              "vendor/bin/hw/android.hardware.drm@1.3-service.clearkey"
              "vendor/bin/hw/android.hardware.gatekeeper@1.0-service"
              "vendor/bin/hw/android.hardware.graphics.composer@2.1-service"
              "vendor/bin/hw/android.hardware.keymaster@4.0-service"
              "vendor/bin/hw/android.hardware.media.omx@1.0-service"
              "vendor/bin/hw/android.hardware.memtrack@1.0-service"
              "vendor/bin/hw/android.hardware.sensors@1.0-service"
              "vendor/bin/boringssl_self_test32"
              "vendor/etc/init/android.hardware.audio.service.rc"
              "vendor/etc/init/android.hardware.cas@1.2-service.rc"
              "vendor/etc/init/android.hardware.drm@1.3-service.clearkey.rc"
              "vendor/etc/init/android.hardware.gatekeeper@1.0-service.rc"
              "vendor/etc/init/android.hardware.graphics.composer@2.1-service.rc"
              "vendor/etc/init/android.hardware.keymaster@4.0-service.rc"
              "vendor/etc/init/android.hardware.media.omx@1.0-service.rc"
              "vendor/etc/init/android.hardware.memtrack@1.0-service.rc"
              "vendor/etc/init/android.hardware.sensors@1.0-service.rc"
              "vendor/etc/init/boringssl_self_test.rc"
              "vendor/etc/media_codecs.xml"
              "vendor/etc/mkshrc"
              "vendor/etc/seccomp_policy/mediaextractor.policy"
              "vendor/etc/seccomp_policy/mediaswcodec.policy"
              "vendor/etc/selinux/vendor_file_contexts"
              "vendor/etc/selinux/vendor_hwservice_contexts"
              "vendor/etc/selinux/vendor_property_contexts"
              "vendor/etc/selinux/vendor_service_contexts"
              "vendor/etc/vintf/compatibility_matrix.xml"
              "vendor/etc/vintf/manifest/android.hardware.cas@1.2-service.xml"
              "vendor/etc/vintf/manifest/manifest_android.hardware.drm@1.3-service.clearkey.xml"
            )
            printf '%s\n' "${CONFLICT_LINES[@]}" > /tmp/conflict-lines.txt
            grep -vFf /tmp/conflict-lines.txt "$PF" > /tmp/proprietary-files.clean.txt
            cp /tmp/proprietary-files.clean.txt "$PF"

            DEVICE_PF="device/samsung/${{ github.event.inputs.device }}/proprietary-files.txt"
            mkdir -p "$(dirname "$DEVICE_PF")"
            cp "$PF" "$DEVICE_PF"
          fi

          LEGACY_HELPER_DIR="vendor/lineage/build/tools"
          LEGACY_HELPER="$LEGACY_HELPER_DIR/extract_utils.sh"
          NEW_HELPER="tools/extract-utils/extract_utils.sh"
          mkdir -p "$LEGACY_HELPER_DIR"
          if [ -f "$NEW_HELPER" ]; then
            cp "$NEW_HELPER" "$LEGACY_HELPER"
          else
            curl -L -o "$LEGACY_HELPER" \
              "https://raw.githubusercontent.com/LineageOS/android_tools_extract-utils/lineage-18.1/extract_utils.sh"
          fi

          if [ -f "$SETUP" ]; then
            bash "$SETUP"
          fi

      - name: Build vendor image (mode lite)
        env:
          WITHOUT_CHECK_API: "true"
          USE_CCACHE: "0"
        run: |
          cd ~/lineage20
          source build/envsetup.sh
          lunch ${{ github.event.inputs.lunch_target }}
          make ${{ github.event.inputs.build_target }} -j$(nproc)

      - name: Bersihin intermediate build
        run: |
          cd ~/lineage20
          find out/target/product/${{ github.event.inputs.device }}/obj -mindepth 1 -maxdepth 1 -type d ! -name "PACKAGING" -exec rm -rf {} + 2>/dev/null || true
          df -h

      - name: Upload hasil sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendor-build-lite-${{ github.event.inputs.device }}
          path: |
            /home/runner/lineage20/out/target/product/${{ github.event.inputs.device }}/vendor.img
            /home/runner/lineage20/out/target/product/${{ github.event.inputs.device }}/*.zip
          if-no-files-found: warn
          retention-days: 7
